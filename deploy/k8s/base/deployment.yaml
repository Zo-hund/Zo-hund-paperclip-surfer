apiVersion: apps/v1
kind: Deployment
metadata:
  name: amx-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amx-app
  template:
    metadata:
      labels:
        app: amx-app
    spec:
      containers:
        - name: amx-app
          image: amx-air-hubs:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3100
              name: http
          envFrom:
            - configMapRef:
                name: amx-config
            - secretRef:
                name: amx-secrets
          volumeMounts:
            - name: paperclip-home
              mountPath: /paperclip
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: paperclip-home
          emptyDir: {}
