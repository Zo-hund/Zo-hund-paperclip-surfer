---
# Read-only ClusterRole for on-call engineers and monitoring systems.
# Can observe everything in the AMX namespaces but cannot modify any resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paperclip-viewer
  labels:
    app.kubernetes.io/name: paperclip-viewer
    app.kubernetes.io/component: operations
    app.kubernetes.io/managed-by: kubectl
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - configmaps
      - events
      - serviceaccounts
      - persistentvolumeclaims
      - nodes
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  # Secrets: list only (no data read — can see names but not values)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
# Bind viewer role to the amx-air-hubs production namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperclip-viewer
  namespace: amx-air-hubs
  labels:
    app.kubernetes.io/name: paperclip-viewer
    app.kubernetes.io/component: operations
    app.kubernetes.io/managed-by: kubectl
subjects: []  # Add users/groups here, e.g.:
  # - kind: User
  #   name: "alice@example.com"
  #   apiGroup: rbac.authorization.k8s.io
  # - kind: Group
  #   name: "oncall-team"
  #   apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: paperclip-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Bind viewer role to the staging namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperclip-viewer
  namespace: amx-air-hubs-staging
  labels:
    app.kubernetes.io/name: paperclip-viewer
    app.kubernetes.io/component: operations
    app.kubernetes.io/managed-by: kubectl
subjects: []  # Same pattern — fill in your team identities
roleRef:
  kind: ClusterRole
  name: paperclip-viewer
  apiGroup: rbac.authorization.k8s.io
