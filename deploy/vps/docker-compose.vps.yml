services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TRAEFIK_ACME_STORAGE:-./traefik/acme}:/letsencrypt
    networks:
      - amx

  amx:
    image: ${AMX_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.vps
    group_add:
      - "988"
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      DATABASE_URL: ${DATABASE_URL}
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_INSTANCE_ID: default
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RUNWAYML_API_SECRET: ${RUNWAYML_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PAPERCLIP_EMAIL_FROM: ${PAPERCLIP_EMAIL_FROM:-}
      PAPERCLIP_EMAIL_REPLY_TO: ${PAPERCLIP_EMAIL_REPLY_TO:-}
      VPS_COMPOSE_FILE: /deploy/docker-compose.vps.yml
      VPS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-amx-air-hubs}
      GIT_AUTHOR_NAME: ${GIT_AGENT_NAME:-AMX Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AGENT_EMAIL:-agents@amx-air-hubs.cc}
      GIT_COMMITTER_NAME: ${GIT_AGENT_NAME:-AMX Agent}
      GIT_COMMITTER_EMAIL: ${GIT_AGENT_EMAIL:-agents@amx-air-hubs.cc}
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ${PAPERCLIP_DATA_PATH:-./paperclip-data}:/paperclip
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/bin/git:/usr/bin/git:ro
      - /root/paperclip/deploy/vps:/deploy:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.amx.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.amx.entrypoints=websecure
      - traefik.http.routers.amx.tls=true
      - traefik.http.routers.amx.tls.certresolver=letsencrypt
      - traefik.http.services.amx.loadbalancer.server.port=3100
    networks:
      - amx

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.${TRAEFIK_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${TRAEFIK_DOMAIN}/
    volumes:
      - ./n8n-data:/home/node/.n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=letsencrypt
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    networks:
      - amx

networks:
  amx:
    name: ${COMPOSE_PROJECT_NAME:-amx-air-hubs}
