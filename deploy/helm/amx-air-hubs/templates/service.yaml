apiVersion: v1
kind: Service
metadata:
  name: {{ include "amx-air-hubs.fullname" . }}
  labels:
    {{- include "amx-air-hubs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "amx-air-hubs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
