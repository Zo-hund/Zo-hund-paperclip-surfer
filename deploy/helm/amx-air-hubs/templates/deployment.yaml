apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amx-air-hubs.fullname" . }}
  labels:
    {{- include "amx-air-hubs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "amx-air-hubs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "amx-air-hubs.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "amx-air-hubs.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.affinity.podAntiAffinity.enabled .Values.topologySpreadConstraints.enabled }}
      affinity:
        {{- if .Values.affinity.podAntiAffinity.enabled }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.affinity.podAntiAffinity.topologyKey }}
                labelSelector:
                  matchLabels:
                    {{- include "amx-air-hubs.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "amx-air-hubs.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: amx-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "amx-air-hubs.fullname" . }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.databaseUrl }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.betterAuthSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.openaiApiKey }}
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.anthropicApiKey }}
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.googleApiKey }}
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.geminiApiKey }}
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.resendApiKey }}
                  optional: true
            - name: LIVEKIT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.livekitUrl }}
                  optional: true
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.livekitApiKey }}
                  optional: true
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.livekitApiSecret }}
                  optional: true
            - name: PAPERCLIP_AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "amx-air-hubs.secretName" . }}
                  key: {{ .Values.secrets.keys.agentJwtSecret }}
                  optional: true
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: paperclip-home
              mountPath: /paperclip
      volumes:
        - name: paperclip-home
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "amx-air-hubs.persistenceClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
