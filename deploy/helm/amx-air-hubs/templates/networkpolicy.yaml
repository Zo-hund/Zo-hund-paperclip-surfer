{{- if .Values.networkPolicy.enabled }}
---
# Default deny all — blocks all pod-to-pod and pod-to-external traffic unless explicitly allowed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "amx-air-hubs.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amx-air-hubs.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from the nginx ingress controller to app pods on port 3100.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "amx-air-hubs.fullname" . }}-allow-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amx-air-hubs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "amx-air-hubs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3100
---
# Allow DNS egress (required for name resolution).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "amx-air-hubs.fullname" . }}-allow-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amx-air-hubs.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow HTTPS egress for AI provider APIs (Anthropic, OpenAI, Google, LiveKit, Resend).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "amx-air-hubs.fullname" . }}-allow-https
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amx-air-hubs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "amx-air-hubs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow egress to external Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "amx-air-hubs.fullname" . }}-allow-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amx-air-hubs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "amx-air-hubs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.postgresCidr | default "10.0.0.0/8" | quote }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
