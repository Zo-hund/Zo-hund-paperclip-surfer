replicaCount: 2

image:
  repository: ghcr.io/amx-labs/amx-air-hubs
  tag: latest
  pullPolicy: IfNotPresent

ingress:
  host: staging.amx-air-hubs.cc
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  tls:
    - secretName: amx-air-hubs-staging-tls
      hosts:
        - staging.amx-air-hubs.cc

env:
  PAPERCLIP_PUBLIC_URL: https://staging.amx-air-hubs.cc

persistence:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

podDisruptionBudget:
  minAvailable: 1
