services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperclip}
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD:-paperclip}@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      PAPERCLIP_AGENT_JWT_SECRET: "${PAPERCLIP_AGENT_JWT_SECRET:-}"
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      # LiveKit ships OBSERVED. required:true needs BOTH of the next two flags.
      LIVEKIT_ENABLED: "${LIVEKIT_ENABLED:-false}"
      LIVEKIT_REQUIRED: "${LIVEKIT_REQUIRED:-false}"
      LIVEKIT_PITSTOP_APPROVED: "${LIVEKIT_PITSTOP_APPROVED:-false}"
      # Base44 meeting bridge — CORS allowlist + 6.8B external-client auth.
      BASE44_ALLOWED_ORIGINS: "${BASE44_ALLOWED_ORIGINS:-}"
      AMX_EXTERNAL_CLIENT_SECRET: "${AMX_EXTERNAL_CLIENT_SECRET:-}"
      AMX_EXTERNAL_CLIENT_ID: "${AMX_EXTERNAL_CLIENT_ID:-}"
      AMX_EXTERNAL_CLIENT_ISS: "${AMX_EXTERNAL_CLIENT_ISS:-}"
      AMX_EXTERNAL_CLIENT_AUD: "${AMX_EXTERNAL_CLIENT_AUD:-}"
      AMX_EXTERNAL_CLIENT_REDIRECT_URIS: "${AMX_EXTERNAL_CLIENT_REDIRECT_URIS:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_LOG_DIR: "/paperclip/instances/default/logs"
      PAPERCLIP_STORAGE_LOCAL_DIR: "/paperclip/instances/default/data/storage"
      PAPERCLIP_SECRETS_MASTER_KEY_FILE: "/paperclip/instances/default/secrets/master.key"
      PAPERCLIP_DB_BACKUP_DIR: "/paperclip/instances/default/data/backups"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=false

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  pgdata:
  paperclip-data:
  n8n-data:
