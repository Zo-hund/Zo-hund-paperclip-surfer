name: Deploy AMX Cluster

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: false
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Immutable image tag to deploy, for example sha-<commit>
        required: true
        type: string
      namespace:
        description: Optional Kubernetes namespace override
        required: false
        default: ""
        type: string
      release_name:
        description: Optional Helm release name override
        required: false
        default: ""
        type: string
      ingress_host:
        description: Optional public ingress host override
        required: false
        default: ""
        type: string
  workflow_run:
    workflows:
      - ci
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-amx-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      url: https://${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && 'amx-air-hubs.cc' || 'staging.amx-air-hubs.cc' }}
    permissions:
      contents: read
      packages: read
      id-token: write  # required for cosign verify (keyless)
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/amx-air-hubs
      DEFAULT_NAMESPACE: amx-air-hubs
      DEFAULT_RELEASE_NAME: amx-air-hubs
      DEFAULT_INGRESS_HOST: amx-air-hubs.cc
      STAGING_NAMESPACE: amx-air-hubs-staging
      STAGING_RELEASE_NAME: amx-air-hubs-staging
      STAGING_INGRESS_HOST: staging.amx-air-hubs.cc
      IMAGE_PULL_SECRET_NAME: amx-ghcr
      CLOUD_VALUES_FILE: ./deploy/helm/amx-air-hubs/values-cloud.yaml
      STAGING_VALUES_FILE: ./deploy/helm/amx-air-hubs/values-staging.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set deployment variables
        id: vars
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_REPOSITORY="ghcr.io/${OWNER_LOWER}/amx-air-hubs"
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="sha-${{ github.event.workflow_run.head_sha || github.sha }}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENVIRONMENT="${{ inputs.environment }}"
          else
            TARGET_ENVIRONMENT="staging"
          fi

          if [ "${TARGET_ENVIRONMENT}" = "production" ]; then
            DEFAULT_NAMESPACE_FOR_ENV="${DEFAULT_NAMESPACE}"
            DEFAULT_RELEASE_NAME_FOR_ENV="${DEFAULT_RELEASE_NAME}"
            DEFAULT_INGRESS_HOST_FOR_ENV="${DEFAULT_INGRESS_HOST}"
            VALUES_FILE="${CLOUD_VALUES_FILE}"
          else
            DEFAULT_NAMESPACE_FOR_ENV="${STAGING_NAMESPACE}"
            DEFAULT_RELEASE_NAME_FOR_ENV="${STAGING_RELEASE_NAME}"
            DEFAULT_INGRESS_HOST_FOR_ENV="${STAGING_INGRESS_HOST}"
            VALUES_FILE="${STAGING_VALUES_FILE}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.namespace }}" ]; then
            NAMESPACE="${{ inputs.namespace }}"
          else
            NAMESPACE="${DEFAULT_NAMESPACE_FOR_ENV}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_name }}" ]; then
            RELEASE_NAME="${{ inputs.release_name }}"
          else
            RELEASE_NAME="${DEFAULT_RELEASE_NAME_FOR_ENV}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ingress_host }}" ]; then
            INGRESS_HOST="${{ inputs.ingress_host }}"
          else
            INGRESS_HOST="${DEFAULT_INGRESS_HOST_FOR_ENV}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "environment=${TARGET_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ingress_host=${INGRESS_HOST}" >> "$GITHUB_OUTPUT"
          echo "values_file=${VALUES_FILE}" >> "$GITHUB_OUTPUT"
          if [ -n "${GHCR_PULL_USERNAME}" ] && [ -n "${GHCR_PULL_TOKEN}" ]; then
            echo "pull_secret_arg=--set image.pullSecrets[0].name=${IMAGE_PULL_SECRET_NAME}" >> "$GITHUB_OUTPUT"
            echo "pull_secret_status=${IMAGE_PULL_SECRET_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "pull_secret_arg=" >> "$GITHUB_OUTPUT"
            echo "pull_secret_status=not applied (public package or pre-provisioned cluster access assumed)" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Cloudflare staging DNS record
        if: ${{ steps.vars.outputs.environment == 'staging' && steps.vars.outputs.ingress_host == 'staging.amx-air-hubs.cc' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          AMX_STAGING_DNS_TARGET: ${{ vars.AMX_STAGING_DNS_TARGET }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ] || [ -z "${AMX_STAGING_DNS_TARGET}" ]; then
            echo "Cloudflare DNS automation is not fully configured; validating existing DNS only."
            exit 0
          fi

          DNS_RECORD_NAME="${{ steps.vars.outputs.ingress_host }}" \
          DNS_RECORD_CONTENT="${AMX_STAGING_DNS_TARGET}" \
          node ./deploy/scripts/cloudflare-upsert-dns.mjs

      - name: Verify public ingress DNS
        shell: bash
        run: |
          INGRESS_HOST="${{ steps.vars.outputs.ingress_host }}"
          if ! getent ahosts "${INGRESS_HOST}" >/dev/null; then
            {
              echo "::error title=Missing public DNS::${INGRESS_HOST} does not resolve. Add or repair the DNS record before deploying this environment."
              echo "Expected Cloudflare setup for staging: create a proxied CNAME or A/AAAA record for ${INGRESS_HOST} pointing at the staging ingress target."
              echo "To let this workflow repair staging DNS automatically, configure environment secret CLOUDFLARE_API_TOKEN, environment secret CLOUDFLARE_ZONE_ID, and environment variable AMX_STAGING_DNS_TARGET."
            } >&2
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBE_CONFIG_DATA}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Create namespace
        run: kubectl create namespace "${{ steps.vars.outputs.namespace }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify published image tag exists
        run: docker buildx imagetools inspect "${{ steps.vars.outputs.image_ref }}"

      - name: Verify image signature (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/ci.yml" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ steps.vars.outputs.image_ref }}" || {
            echo "WARNING: Image signature verification failed. Proceeding (first deploy may be unsigned)."
          }

      - name: Apply AMX runtime secret
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.AMX_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.AMX_BETTER_AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          kubectl create secret generic amx-secrets \
            --namespace "${{ steps.vars.outputs.namespace }}" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=BETTER_AUTH_SECRET="${BETTER_AUTH_SECRET}" \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY}" \
            --from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            --from-literal=GOOGLE_API_KEY="${GOOGLE_API_KEY}" \
            --from-literal=OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply GHCR image pull secret
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "${GHCR_PULL_USERNAME}" ] || [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "GHCR pull credentials are not configured; skipping image pull secret creation."
            exit 0
          fi

          kubectl create secret docker-registry "${IMAGE_PULL_SECRET_NAME}" \
            --namespace "${{ steps.vars.outputs.namespace }}" \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_PULL_USERNAME}" \
            --docker-password="${GHCR_PULL_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm lint
        run: helm lint ./deploy/helm/amx-air-hubs

      - name: Helm template selected environment
        run: >
          helm template "${{ steps.vars.outputs.release_name }}" ./deploy/helm/amx-air-hubs
          --values "${{ steps.vars.outputs.values_file }}"
          --set fullnameOverride="${{ steps.vars.outputs.release_name }}"
          --set image.repository="${{ env.IMAGE_REPOSITORY }}"
          --set image.tag="${{ steps.vars.outputs.image_tag }}"
          --set ingress.host="${{ steps.vars.outputs.ingress_host }}"
          --set env.PAPERCLIP_PUBLIC_URL="https://${{ steps.vars.outputs.ingress_host }}"
          --set secrets.existingSecretName=amx-secrets
          ${{ steps.vars.outputs.pull_secret_arg }}

      - name: Deploy Helm release
        run: >
          helm upgrade --install "${{ steps.vars.outputs.release_name }}" ./deploy/helm/amx-air-hubs
          --namespace "${{ steps.vars.outputs.namespace }}"
          --create-namespace
          --atomic
          --wait
          --timeout 10m
          --values "${{ steps.vars.outputs.values_file }}"
          --set fullnameOverride="${{ steps.vars.outputs.release_name }}"
          --set image.repository="${{ env.IMAGE_REPOSITORY }}"
          --set image.tag="${{ steps.vars.outputs.image_tag }}"
          --set ingress.host="${{ steps.vars.outputs.ingress_host }}"
          --set env.PAPERCLIP_PUBLIC_URL="https://${{ steps.vars.outputs.ingress_host }}"
          --set secrets.existingSecretName=amx-secrets
          ${{ steps.vars.outputs.pull_secret_arg }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/"${{ steps.vars.outputs.release_name }}" --namespace "${{ steps.vars.outputs.namespace }}" --timeout=10m

      - name: Smoke test public ingress path
        shell: bash
        run: |
          URL="https://${{ steps.vars.outputs.ingress_host }}"
          for attempt in $(seq 1 20); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "${URL}" || true)"
            if [[ "${status}" =~ ^[0-9]+$ ]] && [ "${status}" -ge 200 ] && [ "${status}" -lt 400 ]; then
              echo "Smoke test passed for ${URL} with status ${status}"
              exit 0
            fi
            echo "Waiting for ${URL} to become ready (attempt ${attempt}/20, status=${status:-none})"
            sleep 15
          done
          echo "Smoke test failed for ${URL}" >&2
          exit 1

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## AMX cluster deployment"
            echo
            echo "- Environment: \`${{ steps.vars.outputs.environment }}\`"
            echo "- Release: \`${{ steps.vars.outputs.release_name }}\`"
            echo "- Namespace: \`${{ steps.vars.outputs.namespace }}\`"
            echo "- Host: [https://${{ steps.vars.outputs.ingress_host }}](https://${{ steps.vars.outputs.ingress_host }})"
            echo "- Image: \`${{ steps.vars.outputs.image_ref }}\`"
            echo "- Values file: \`${{ steps.vars.outputs.values_file }}\`"
            echo "- GHCR pull secret: \`${{ steps.vars.outputs.pull_secret_status }}\`"
            echo
            echo "### Verify"
            echo "- \`kubectl get pods -n ${{ steps.vars.outputs.namespace }}\`"
            echo "- \`kubectl get ingress -n ${{ steps.vars.outputs.namespace }}\`"
            echo "- \`kubectl get hpa -n ${{ steps.vars.outputs.namespace }}\`"
            echo "- \`kubectl rollout status deployment/${{ steps.vars.outputs.release_name }} -n ${{ steps.vars.outputs.namespace }}\`"
            echo "- \`curl -I https://${{ steps.vars.outputs.ingress_host }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
