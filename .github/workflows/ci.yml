name: ci

# Deny all permissions by default; each job grants only what it needs
permissions: {}

# Prevent concurrent runs on the same branch/PR â€” cancel the old one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - experimental
      - main
      - master

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release gate rejection tests
        run: python3 -m unittest discover -s deploy/release -p 'test_*.py' -v

      - name: Validate release workflow syntax
        run: >-
          docker run --rm --user 0 -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -config-file .github/actionlint.yaml -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/deploy-vps.yml
          .github/workflows/release-docker.yml .github/workflows/deploy-cluster.yml

      - name: Run smoke pipeline
        run: pnpm run pipeline:smoke

  smoke_twice_non_blocking:
    name: smoke twice (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run flaky visibility check
        run: pnpm run pipeline:smoke:twice

  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit for critical vulnerabilities
        # Blocks CI on critical-severity issues (RCE, arbitrary file read, etc.)
        # High-severity step below is informational â€” some high CVEs (e.g. lodash
        # <=4.17.21) have no released fix and must not block deploys indefinitely.
        run: pnpm audit --audit-level=critical

      - name: Audit for high vulnerabilities
        run: pnpm audit --audit-level=high


      - name: Validate cluster compose pack
        shell: bash
        run: |
          cp .env.cluster.example .env.cluster
          docker compose --env-file .env.cluster -f docker-compose.cluster.yml config >/dev/null

      - name: Validate VPS compose pack
        shell: bash
        run: |
          cp deploy/vps/.env.vps.example deploy/vps/.env.vps
          docker compose --env-file deploy/vps/.env.vps -f deploy/vps/docker-compose.vps.yml config >/dev/null

      - name: Validate Hostinger compose pack
        shell: bash
        run: |
          cp deploy/vps/.env.hostinger.example deploy/vps/.env
          docker compose --env-file deploy/vps/.env -f deploy/vps/docker-compose.hostinger.yml config >/dev/null

      - name: Run Typecheck
        run: pnpm -r typecheck

      - name: Run Tests
        run: pnpm test:run

      - name: Run AMX AIR Hubs Worker contract tests
        run: pnpm --filter @amx/air-hubs test

  helm-validate:
    name: helm validate
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint
        run: helm lint ./deploy/helm/amx-air-hubs

      - name: Helm template local
        run: >
          helm template amx-air-hubs ./deploy/helm/amx-air-hubs
          --values ./deploy/helm/amx-air-hubs/values-local.yaml
          --set secrets.existingSecretName=amx-secrets

      - name: Helm template staging
        run: >
          helm template amx-air-hubs-staging ./deploy/helm/amx-air-hubs
          --values ./deploy/helm/amx-air-hubs/values-staging.yaml
          --set fullnameOverride=amx-air-hubs-staging
          --set secrets.existingSecretName=amx-secrets

      - name: Helm template cloud
        run: >
          helm template amx-air-hubs ./deploy/helm/amx-air-hubs
          --values ./deploy/helm/amx-air-hubs/values-cloud.yaml
          --set secrets.existingSecretName=amx-secrets

  docker:
    name: docker
    needs:
      - build-and-test
      - helm-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # required for cosign keyless signing
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimental'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image coordinates
        id: image
        shell: bash
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amx-air-hubs"
          TAG="sha-${GITHUB_SHA}"
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=experimental,enable=${{ github.ref == 'refs/heads/experimental' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.image.outputs.tag }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/experimental' }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_id }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.image.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Scan image for vulnerabilities (Trivy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimental'
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build-push.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'   # fail the job on HIGH/CRITICAL
          format: table

      - name: Sign image with cosign (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimental'
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.image.outputs.repository }}@${DIGEST}"

      - name: Test the published digest in an isolated container
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimental'
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          CID=$(docker run -d --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:3100:3100 \
            -e PAPERCLIP_DEPLOYMENT_MODE=authenticated \
            -e PAPERCLIP_DEPLOYMENT_EXPOSURE=private \
            -e PAPERCLIP_PUBLIC_URL=http://localhost:3100 \
            -e HEARTBEAT_SCHEDULER_ENABLED=false \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" "$RELEASE_IMAGE")
          trap 'docker rm -fv "$CID" >/dev/null' EXIT
          for attempt in {1..60}; do
            if python3 deploy/release/smoke.py http://localhost:3100; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Write immutable release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimental'
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('release.json').write_text(json.dumps({
            'repository': os.environ['GITHUB_REPOSITORY'],
            'sha': os.environ['GITHUB_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'digest': os.environ['IMAGE_DIGEST'],
            'image': os.environ['IMAGE_REPOSITORY'] + '@' + os.environ['IMAGE_DIGEST']
          }))
          PY

      - name: Upload validated release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/experimental'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governed-release-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish image summary
        run: |
          echo "Pushed image: ${{ steps.image.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build-push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
