name: ci

# Deny all permissions by default; each job grants only what it needs
permissions: {}

# Prevent concurrent runs on the same branch/PR — cancel the old one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - experimental
      - main
      - master

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke pipeline
        run: pnpm run pipeline:smoke

  smoke_twice_non_blocking:
    name: smoke twice (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run flaky visibility check
        run: pnpm run pipeline:smoke:twice

  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit for critical vulnerabilities
        # Blocks CI on critical-severity issues (RCE, arbitrary file read, etc.)
        # High-severity step below is informational — some high CVEs (e.g. lodash
        # <=4.17.21) have no released fix and must not block deploys indefinitely.
        run: pnpm audit --audit-level=critical

      - name: Audit for high vulnerabilities (informational)
        run: pnpm audit --audit-level=high
        continue-on-error: true


      - name: Validate cluster compose pack
        shell: bash
        run: |
          cp .env.cluster.example .env.cluster
          docker compose --env-file .env.cluster -f docker-compose.cluster.yml config >/dev/null

      - name: Validate VPS compose pack
        shell: bash
        run: |
          cp deploy/vps/.env.vps.example deploy/vps/.env.vps
          docker compose --env-file deploy/vps/.env.vps -f deploy/vps/docker-compose.vps.yml config >/dev/null

      - name: Validate Hostinger compose pack
        shell: bash
        run: |
          cp deploy/vps/.env.hostinger.example deploy/vps/.env
          docker compose --env-file deploy/vps/.env -f deploy/vps/docker-compose.hostinger.yml config >/dev/null

      - name: Run Typecheck
        run: pnpm -r typecheck

      - name: Run Tests
        run: pnpm test:run

  helm-validate:
    name: helm validate
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint
        run: helm lint ./deploy/helm/amx-air-hubs

      - name: Helm template local
        run: >
          helm template amx-air-hubs ./deploy/helm/amx-air-hubs
          --values ./deploy/helm/amx-air-hubs/values-local.yaml
          --set secrets.existingSecretName=amx-secrets

      - name: Helm template staging
        run: >
          helm template amx-air-hubs-staging ./deploy/helm/amx-air-hubs
          --values ./deploy/helm/amx-air-hubs/values-staging.yaml
          --set fullnameOverride=amx-air-hubs-staging
          --set secrets.existingSecretName=amx-secrets

      - name: Helm template cloud
        run: >
          helm template amx-air-hubs ./deploy/helm/amx-air-hubs
          --values ./deploy/helm/amx-air-hubs/values-cloud.yaml
          --set secrets.existingSecretName=amx-secrets

  docker:
    name: docker
    needs:
      - build-and-test
      - helm-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # required for cosign keyless signing
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set image coordinates
        id: image
        shell: bash
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amx-air-hubs"
          TAG="sha-${GITHUB_SHA}"
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=experimental,enable=${{ github.ref == 'refs/heads/experimental' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.image.outputs.tag }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_id }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.image.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Scan image for vulnerabilities (Trivy)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          exit-code: '1'   # fail the job on HIGH/CRITICAL
          format: table

      - name: Sign image with cosign (keyless)
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.image.outputs.repository }}@${DIGEST}"

      - name: Publish image summary
        run: |
          echo "Pushed image: ${{ steps.image.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build-push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
