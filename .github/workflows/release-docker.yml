name: release-docker

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_validate_publish:
    name: docker release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
      PAPERCLIP_PUBLIC_URL: ${{ vars.PAPERCLIP_PUBLIC_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.GHCR_PAT || secrets.REGISTRY_TOKEN }}
    steps:
      - name: Validate required release configuration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${REGISTRY_IMAGE:-}" ] || { echo "Missing required repo variable: REGISTRY_IMAGE"; exit 1; }
          [ -n "${PAPERCLIP_PUBLIC_URL:-}" ] || { echo "Missing required repo variable: PAPERCLIP_PUBLIC_URL"; exit 1; }
          [ -n "${BETTER_AUTH_SECRET:-}" ] || { echo "Missing required secret: BETTER_AUTH_SECRET"; exit 1; }
          [ -n "${REGISTRY_USERNAME:-}" ] || { echo "Missing required secret: REGISTRY_USERNAME"; exit 1; }
          [ -n "${REGISTRY_TOKEN:-}" ] || { echo "Missing required secret: REGISTRY_TOKEN"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="sha-${GITHUB_SHA::12}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY_IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${REGISTRY_IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "${{ steps.meta.outputs.image }}" -t "${{ steps.meta.outputs.latest_image }}" .

      - name: Smoke run container
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d \
            -e HOST=0.0.0.0 \
            -e PAPERCLIP_HOME=/paperclip \
            -e PAPERCLIP_DEPLOYMENT_MODE=authenticated \
            -e PAPERCLIP_DEPLOYMENT_EXPOSURE=public \
            -e PAPERCLIP_PUBLIC_URL="${PAPERCLIP_PUBLIC_URL}" \
            -e BETTER_AUTH_SECRET="${BETTER_AUTH_SECRET}" \
            -p 3100:3100 \
            "${{ steps.meta.outputs.image }}")"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" || true' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Container failed smoke health check on /api/health"
          exit 1

      - name: Push versioned + latest image
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.latest_image }}"

      - name: Write release metadata
        shell: bash
        run: |
          cat > release-metadata.json <<EOF
          {
            "repo": "${GITHUB_REPOSITORY}",
            "sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "image": "${{ steps.meta.outputs.image }}",
            "latestImage": "${{ steps.meta.outputs.latest_image }}",
            "deploymentMode": "authenticated/public",
            "validatedHealthEndpoint": "/api/health"
          }
          EOF

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata.json
