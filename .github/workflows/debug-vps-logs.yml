name: Debug VPS Logs (temporary)

on:
  workflow_dispatch:
    inputs:
      container:
        description: Container name to fetch logs from
        required: true
        type: string
        default: paperclip-voice-agent-1
      tail:
        description: Number of log lines to fetch
        required: false
        type: string
        default: "300"

jobs:
  logs:
    runs-on: [self-hosted, vps]
    steps:
      - name: Dump container logs
        shell: bash
        run: |
          echo "=== Logs: ${{ inputs.container }} (last ${{ inputs.tail }} lines) ==="
          docker logs --tail "${{ inputs.tail }}" "${{ inputs.container }}" 2>&1 | tail -n "${{ inputs.tail }}"
