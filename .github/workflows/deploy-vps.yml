name: Deploy AMX VPS
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [experimental]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful experimental CI run ID containing governed release metadata
        type: string
        required: true
      promote_production:
        description: Re-test staging then request human production approval for the same digest
        type: boolean
        default: false
permissions: {}
concurrency:
  group: amx-vps-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'Zo-hund/Zo-hund-paperclip-surfer' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/experimental') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.release.outputs.image }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: experimental
          persist-credentials: false
      - name: Retrieve successful CI run and its metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > run.json
          ATTEMPT="$(python3 -c 'import json; print(int(json.load(open("run.json"))["run_attempt"]))')"
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "governed-release-$ATTEMPT" --dir release-artifact
      - name: Validate source, outcome, attempt and immutable digest
        id: release
        run: python3 deploy/release/validate-release.py run.json release-artifact/release.json >> "$GITHUB_OUTPUT"
      - name: Show the exact release for human review
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          printf 'Release image: %s\nSource commit: %s\nProduction requires this digest to pass staging and human approval.\n' "$RELEASE_IMAGE" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: release
    runs-on: [self-hosted, vps]
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.amx-air-hubs.cc
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_IMAGE: ${{ needs.release.outputs.image }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Isolate registry credentials
        run: |
          umask 077
          CONFIG_DIR=$(mktemp -d "$RUNNER_TEMP/amx-docker.XXXXXX")
          echo "DOCKER_CONFIG=$CONFIG_DIR" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
      - name: Verify exact digest and authorized signing identity
        shell: bash
        run: |
          set -euo pipefail
          cosign verify "$RELEASE_IMAGE" \
            --certificate-identity="https://github.com/Zo-hund/Zo-hund-paperclip-surfer/.github/workflows/ci.yml@refs/heads/experimental" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha="$RELEASE_SHA" > /dev/null
      - name: Deploy and verify staging
        run: python3 deploy/release/host-deploy.py staging "$RELEASE_IMAGE" "$RELEASE_SHA"
      - name: Record verified deployment
        run: |
          printf 'Verified staging: %s\nCommit: %s\n' "$RELEASE_IMAGE" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: [release, staging]
    if: github.event_name == 'workflow_dispatch' && inputs.promote_production
    runs-on: [self-hosted, vps]
    timeout-minutes: 30
    environment:
      name: hostinger-prod
      url: https://amx-air-hubs.cc
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_IMAGE: ${{ needs.release.outputs.image }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Isolate registry credentials
        run: |
          umask 077
          CONFIG_DIR=$(mktemp -d "$RUNNER_TEMP/amx-docker.XXXXXX")
          echo "DOCKER_CONFIG=$CONFIG_DIR" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
      - name: Verify exact digest and authorized signing identity
        shell: bash
        run: |
          set -euo pipefail
          cosign verify "$RELEASE_IMAGE" \
            --certificate-identity="https://github.com/Zo-hund/Zo-hund-paperclip-surfer/.github/workflows/ci.yml@refs/heads/experimental" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha="$RELEASE_SHA" > /dev/null
      - name: Deploy and verify production
        run: python3 deploy/release/host-deploy.py hostinger-prod "$RELEASE_IMAGE" "$RELEASE_SHA"
      - name: Record verified deployment
        run: |
          printf 'Verified production: %s\nCommit: %s\n' "$RELEASE_IMAGE" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
