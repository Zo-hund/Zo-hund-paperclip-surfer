    fill="white"
    text-anchor="middle"
    dominant-baseline="auto"
  >AMX</text>
  <!-- LABS label -->
  <text
    x="100"
    y="152"
    font-family="'Arial', sans-serif"
    font-weight="400"
    font-size="22"
    letter-spacing="8"
    fill="rgba(255,255,255,0.75)"
    text-anchor="middle"
    dominant-baseline="auto"
  >LABS</text>
